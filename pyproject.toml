[project]
name = "sheet-data-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "utsablpi", email = "utsabkundu.laserpowerinfra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-auth>=2.62.0",
    "gspread>=6.2.1",
    "playwright>=1.64.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "requests>=2.28.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
