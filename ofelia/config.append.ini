; Sheet data automation: CACMAI -> BALCO DECLARED -> linked drag sheets.
; One API call runs the three jobs in order; the API also enforces no overlap.
; 10:00, 13:00 and 16:00 IST daily. Six-field Go cron: sec min hour dom mon dow.
[job-local "sheet-data-automation-daily"]
schedule = 0 0 10,13,16 * * *
command = sh /scripts/api/sheet-data-automation-run-all.sh
no-overlap = true
